<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>myBlog</title>
    <meta name="description" content="Blog Personale">

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            height: 100%;
        }

        body {
            background-color: #96bef2;
            display: flex;
            align-items: center;      /* centra in verticale */
            justify-content: center;  /* centra in orizzontale */
            overflow: hidden;
        }

        /* contenitore: l'immagine fa da layout, il resto si posiziona sopra in percentuale */
        .pagina {
            position: relative;
            width: 100%;
            max-width: 1920px;
            margin: 0 auto;
            container-type: inline-size; /* permette di usare cqw per il testo */
            flex: none;
        }

        .pagina img {
            display: block;
            width: 100%;
            height: auto;
        }

        /* box scorrevole sul foglio di sinistra: aggiusta left/top/width/height a mano */
        .progetti {
            position: absolute;
            left: 35.2%;
            top: 19%;
            width: 23.8%;
            height: 62.5%;

            overflow-y: auto;
            padding: 0.5em 0.8em;
            font-size: clamp(10px, 1.15cqw, 24px);
            line-height: 1.5;
            color: #2b2118;

            scrollbar-width: thin;
            scrollbar-color: #8a6f4d transparent;
        }

        .progetti .stato {
            margin: 0;
            font-style: italic;
        }

        .progetto {
            display: block;
            padding: 0.4em 0 0.5em;
            border-bottom: 1px solid rgba(80, 60, 40, 0.35);
            color: inherit;
            text-decoration: none;
        }

        .progetto:hover {
            background: rgba(255, 255, 255, 0.35);
        }

        .progetto h3 {
            margin: 0;
            font-size: 1.15em;
            text-decoration: underline;
        }

        .progetto p {
            margin: 0.15em 0 0;
        }

        .progetto small {
            opacity: 0.7;
        }

        .hotspot {
            position: absolute;
            display: block;
            /* decommenta per vedere le aree mentre le posizioni */
            /* outline: 2px solid red; */
        }

        .hotspot:hover {
            background: rgba(255, 255, 255, 0.25);
        }

        .hotspot:focus-visible {
            outline: 2px solid #2b2118;
        }
    </style>

</head>

<body>
    <div class="pagina">
        <img src="sfondo.png" alt="">

        <div class="progetti" id="progetti">
            <p class="stato">Caricamento…</p>
        </div>

        <a class="hotspot" style="left: 16.5%; top: 43%; width: 10.5%; height: 5%;"
        href="LINK-BLOG-DA-AGGIUNGERE" aria-label="it goes here"></a>

        <a class="hotspot" style="left: 5.4%; top: 76%; width: 17.3%; height: 5%;"
        href="https://open.spotify.com/intl-it/track/5RsUlxLto4NZbhJpqJbHfN?si=7a2f23c75b514452" aria-label="music of the month"></a>

        <a class="hotspot" style="left: 48%; top: 87%; width: 10.5%; height: 5%;"
        href="Noemi-Erba_CV.pdf" aria-label="curriculum"></a>

    </div>

    <script>
        const USER = "erbanoemi-hub";
        const box = document.getElementById("progetti");
        const pagina = document.querySelector(".pagina");
        const img = pagina.querySelector("img");

        function adatta() {
            const rapporto = img.naturalWidth / img.naturalHeight;
            const larghezza = Math.min(window.innerWidth, window.innerHeight * rapporto);
            pagina.style.width = larghezza + "px";
        }

        if (img.complete) adatta();
        img.addEventListener("load", adatta);
        window.addEventListener("resize", adatta);

        fetch(`https://api.github.com/users/${USER}/repos?per_page=100&sort=updated`)
            .then(r => {
                if (!r.ok) throw new Error(r.status);
                return r.json();
            })
            .then(repos => {
                const visibili = repos.filter(r => !r.fork);
                if (!visibili.length) {
                    box.innerHTML = '<p class="stato">Nessun progetto.</p>';
                    return;
                }
                box.innerHTML = "";
                visibili.forEach(r => {
                    const a = document.createElement("a");
                    a.className = "progetto";
                    a.href = r.html_url;
                    a.target = "_blank";
                    a.rel = "noopener";

                    const titolo = document.createElement("h3");
                    titolo.textContent = r.name;
                    a.appendChild(titolo);

                    if (r.description) {
                        const d = document.createElement("p");
                        d.textContent = r.description;
                        a.appendChild(d);
                    }

                    const info = document.createElement("small");
                    info.textContent = r.language || "";
                    a.appendChild(info);

                    box.appendChild(a);
                });
            })
            .catch(() => {
                box.innerHTML = '<p class="stato">Impossibile caricare i progetti.</p>';
            });
    </script>
</body>
</html>
